# clippy 配置。与本文件配套的是 Cargo.toml 的 `[lints.clippy]` 里那三条
# `unwrap_used` / `expect_used` / `panic`。

# 为什么需要这三个豁免：本仓的 `unwrap()` / `expect(` 绝大多数在测试里（实测约 3,600 处，
# 生产侧只有 31 处）。测试里 `unwrap()` 是**正确**写法 —— 它让断言失败带上位置信息。
# 没有这三个键，那三条 lint 会被测试代码淹没，等于没开。
#
# 让 clippy 自己判定「什么算测试代码」，而不是我们自己写脚本猜：它能正确识别
# `#[test]` / `#[tokio::test]` / `#[cfg(test)]` 模块，以及**被 `#[cfg(test)]` 修饰的单个函数**
# 和测试专用文件。自写脚本在这两处都会误判（字符串字面量里的花括号会带偏配对、
# 单个 helper 上的 cfg 会被漏掉）。
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
