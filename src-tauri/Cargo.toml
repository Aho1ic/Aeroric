[package]
name = "aeroric"
version = "1.4.6"
description = "Desktop task manager for AI coding agents"
authors = ["Aeroric"]
edition = "2021"
readme = "../README.md"
keywords = ["tauri", "desktop", "ai", "agent", "productivity"]
categories = ["gui", "development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aeroric_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# mock runtime,供 remote 模块的 WS 集成测试构造 AppHandle
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
regex = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "process", "io-util", "net"] }
portable-pty = "0.8"
chrono = "0.4"
base64 = "0.22"
notify = "6"
toml = "0.8"
libc = "0.2"
cap-std = "4"
if-addrs = "0.15"
parking_lot = "0.12"
# query/form/multipart:storage 后端(Box、百度网盘、OAuth token 交换)需要
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "socks", "stream", "query", "form", "multipart"] }
axum = "0.8"
flate2 = "1"
brotli = "7"
zstd = "0.13"
tar = "0.4"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tungstenite = "0.24"
# 手机远程连接(remote 模块):异步 WS 服务端 + 帧收发 + CSPRNG token
# rustls-tls-webpki-roots:relay_client 出站 wss 连自托管 relay(Let's Encrypt 证书)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
getrandom = "0.2"
# E2EE(M4):X25519 握手 + ChaCha20-Poly1305 帧加密 + HKDF 密钥派生
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
crypto_secretbox = "0.1.1"
hkdf = "0.12"
# relay 撮合控制面消息(与 remote-relay 共享)
remote-protocol = { path = "../remote-protocol" }
url = "2"
trash = "=5.2.6"
font-kit = "=0.14.3"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# 随手记 RAG 的向量索引。用 `bundled` 而非 Markio 的 `bundled-full`:libsqlite3-sys
# 0.30 的 build.rs 无条件加 `-DSQLITE_ENABLE_FTS5` 与 `-DSQLITE_ENABLE_LOAD_EXTENSION=1`,
# `sqlite3_auto_extension` 也在无条件绑定里,`modern-full` 那二十个 feature 一个都用不上。
sqlite-vec = "0.1"
# 对象存储 / 网盘 / WebDAV 统一访问层。只启用实际用到的 service,
# 其余 50+ service(hdfs、rocksdb 等)会引入原生工具链依赖,不启用。
opendal = { version = "0.58.1", features = [
  "services-s3",
  "services-oss",
  "services-cos",
  "services-upyun",
  "services-webdav",
  "services-dropbox",
  "services-gdrive",
  "services-onedrive",
  "services-aliyun-drive",
] }
# SMB 客户端(纯 Rust,无需 sudo 挂载)
smb2 = "0.18.1"
dbx-core = { path = "../../dbx/crates/dbx-core", default-features = false }
tauri-plugin-clipboard-manager = "2"

# Windows 没有 mode 位,凭据文件"仅所有者可读写"只能改 DACL(`storage.rs` 的
# `restrict_to_current_user`)。版本跟 tauri/tokio 已经拉进来的那份对齐,不引入第二套。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  # 各项隐私开关记在注册表 CapabilityAccessManager\ConsentStore 下,权限面板要读它。
  "Win32_System_Registry",
] }

# Keep the Aeroric path dependency on the same compatibility forks as dbx.
# The latest dbx-core uses the patched MySQL EOF/auth API and GaussDB-aware
# PostgreSQL crates; resolving these from crates.io would silently produce an
# incompatible lockfile.
#
# The revs/sources below mirror the dbx checkout pinned in `scripts/dbx-ref.txt`
# (its own root `[patch.crates-io]`). When that pin moves, re-check this block —
# `dbx` moved the MySQL fork to a different fork owner and started vendoring
# tiberius, and either divergence resolves silently to a different crate.
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
ssfmt = { path = "vendor/ssfmt" }
notify-types = { path = "vendor/notify-types" }
mysql_async = { git = "https://github.com/zipg/mysql_async.git", rev = "4a9e60a62f5a48e35ef9ccc9fc8277d5012b19dd" }
tokio-postgres = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
postgres-types = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
postgres-protocol = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
# Keeps SQL Server result sets readable when a row carries an unpaired UTF-16
# surrogate (dbx `vendor/tiberius/DBX-PATCH.md`). Resolving tiberius from
# crates.io would drop that fix while still compiling.
tiberius = { path = "../../dbx/vendor/tiberius" }
# Win7-compatible API calls; dbx-core depends on pageant unconditionally.
pageant = { path = "../../dbx/vendor/pageant" }

[features]
# DevTools(右键 → 检查、远程 webview 调试)保持 opt-in,这样 release 构建里没有
# 它——否则任何人都能打开控制台直接驱动 IPC。
#
# 真正起作用的机制是 tauri 侧的 `#[cfg(any(debug_assertions, feature = "devtools"))]`
# (见 tauri 2.11 的 src/webview/mod.rs):debug 构建自动带 devtools,所以
# `tauri dev` 不需要任何配置就能用;release 构建只有显式
# `cargo build --features devtools` 才会带上。
#
# 注意别改成在 tauri.conf.json 里写 `build.features`:那个字段会传给**所有** cargo
# 命令(dev 和 build 都算),等于把 devtools 塞进 release 产物,与本条的目的相反。
devtools = ["tauri/devtools"]

[profile.dev]
debug = 0

[lints.clippy]
# Large IPC/command surfaces legitimately need more params; refactoring signatures
# is tracked separately and must not block CI on pre-existing code.
too_many_arguments = "allow"
# Protocol/state enums hold large payloads by design (legacy sqlite, sftp paths).
large_enum_variant = "allow"
# Tauri State/Mutex type stacks are inherently nested.
type_complexity = "allow"
