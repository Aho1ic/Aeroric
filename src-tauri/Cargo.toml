[package]
name = "aeroric"
version = "1.4.2"
description = "Desktop task manager for AI coding agents"
authors = ["Aeroric"]
edition = "2021"
readme = "../README.md"
keywords = ["tauri", "desktop", "ai", "agent", "productivity"]
categories = ["gui", "development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aeroric_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# mock runtime,供 remote 模块的 WS 集成测试构造 AppHandle
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "process", "io-util", "net"] }
portable-pty = "0.8"
chrono = "0.4"
base64 = "0.22"
notify = "6"
toml = "0.8"
libc = "0.2"
if-addrs = "0.15"
parking_lot = "0.12"
# query/form/multipart:storage 后端(Box、百度网盘、OAuth token 交换)需要
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "socks", "stream", "query", "form", "multipart"] }
axum = "0.8"
flate2 = "1"
brotli = "7"
zstd = "0.13"
tar = "0.4"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tungstenite = "0.24"
# 手机远程连接(remote 模块):异步 WS 服务端 + 帧收发 + CSPRNG token
# rustls-tls-webpki-roots:relay_client 出站 wss 连自托管 relay(Let's Encrypt 证书)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
getrandom = "0.2"
# E2EE(M4):X25519 握手 + ChaCha20-Poly1305 帧加密 + HKDF 密钥派生
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
crypto_secretbox = "0.1.1"
hkdf = "0.12"
# relay 撮合控制面消息(与 remote-relay 共享)
remote-protocol = { path = "../remote-protocol" }
url = "2"
trash = "=5.2.6"
font-kit = "=0.14.3"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# 对象存储 / 网盘 / WebDAV 统一访问层。只启用实际用到的 service,
# 其余 50+ service(hdfs、rocksdb 等)会引入原生工具链依赖,不启用。
opendal = { version = "0.58.1", features = [
  "services-s3",
  "services-oss",
  "services-cos",
  "services-upyun",
  "services-webdav",
  "services-dropbox",
  "services-gdrive",
  "services-onedrive",
  "services-aliyun-drive",
] }
# SMB 客户端(纯 Rust,无需 sudo 挂载)
smb2 = "0.18.1"
dbx-core = { path = "../../dbx/crates/dbx-core", default-features = false }
tauri-plugin-clipboard-manager = "2"

# Keep the Aeroric path dependency on the same compatibility forks as dbx.
# The latest dbx-core uses the patched MySQL EOF/auth API and GaussDB-aware
# PostgreSQL crates; resolving these from crates.io would silently produce an
# incompatible lockfile.
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
ssfmt = { path = "vendor/ssfmt" }
notify-types = { path = "vendor/notify-types" }
mysql_async = { git = "https://github.com/t8y2/mysql_async.git", rev = "b615bb0b10b5975182a4aa069cabc3d09021f6ab" }
tokio-postgres = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "115f9fef10f0fc3669b5337955e4eb461fc349a6" }
postgres-types = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "115f9fef10f0fc3669b5337955e4eb461fc349a6" }
postgres-protocol = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "115f9fef10f0fc3669b5337955e4eb461fc349a6" }

[features]
# DevTools (right-click → Inspect, remote webview debugging) is opt-in so it
# never ships in release builds, where it would let anyone open the console and
# drive IPC directly. `tauri dev` turns it on via tauri.conf.json > build.features.
devtools = ["tauri/devtools"]

[profile.dev]
debug = 0

[lints.clippy]
# Large IPC/command surfaces legitimately need more params; refactoring signatures
# is tracked separately and must not block CI on pre-existing code.
too_many_arguments = "allow"
# Protocol/state enums hold large payloads by design (legacy sqlite, sftp paths).
large_enum_variant = "allow"
# Tauri State/Mutex type stacks are inherently nested.
type_complexity = "allow"
