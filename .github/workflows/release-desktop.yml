name: Release Desktop Builds

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check tag matches package.json / Cargo.toml / tauri.conf.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r .version package.json)
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(awk -F\" '/^version[[:space:]]*=/ {print $2; exit}' src-tauri/Cargo.toml)
          echo "tag=$TAG package.json=$PKG tauri.conf.json=$TAURI Cargo.toml=$CARGO"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$TAURI" ] || [ "$TAG" != "$CARGO" ]; then
            echo "::error::Version mismatch — tag '$TAG' must equal package.json ($PKG), tauri.conf.json ($TAURI), and Cargo.toml ($CARGO)"
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs:
      - quality-gate
      - verify-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            artifact_name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: --bundles nsis,msi
          - name: Windows ARM64
            artifact_name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle_args: --bundles nsis,msi
          - name: macOS x86_64
            artifact_name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle_args: --bundles app
          - name: macOS ARM64
            artifact_name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle_args: --bundles app
          - name: Linux x86_64
            artifact_name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_args: --bundles deb,rpm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout dbx dependency
        shell: bash
        run: |
          set -euo pipefail
          # Pin the dbx path-dependency to a known-good commit so a release tag
          # always builds against the same dbx source. Cargo.lock does not
          # constrain a `path` dependency's contents. The commit lives in
          # scripts/dbx-ref.txt, shared with checks.yml and
          # scripts/prepare-dbx.sh. Bump deliberately.
          DBX_REF="$(tr -d '[:space:]' <scripts/dbx-ref.txt)"
          git init ../dbx
          git -C ../dbx fetch --depth 1 https://github.com/t8y2/dbx.git "$DBX_REF"
          git -C ../dbx checkout --detach "$DBX_REF"

      - name: Apply Aeroric DBX security patch
        shell: bash
        run: ./scripts/prepare-dbx.sh

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # 与 checks.yml 一致：版本由 package.json 的 packageManager 决定，
      # 不再显式传 `version:`（两者同时存在会让 action 直接报错）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Detect release signing credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          REQUIRE_SIGNED_RELEASES: ${{ vars.REQUIRE_SIGNED_RELEASES }}
        run: |
          set -euo pipefail
          missing=()
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
              if [[ -z "${!name}" ]]; then
                missing+=("$name")
              fi
            done
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            for name in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
              if [[ -z "${!name}" ]]; then
                missing+=("$name")
              fi
            done
          fi

          if [[ "${#missing[@]}" -eq 0 && "${{ runner.os }}" != "Linux" ]]; then
            echo "AERORIC_SIGN_RELEASE=true" >> "$GITHUB_ENV"
            echo "Release signing credentials are configured for ${{ runner.os }}."
          else
            echo "AERORIC_SIGN_RELEASE=false" >> "$GITHUB_ENV"
            # 缺少凭据不再中断发布：下面的 unsigned 分支会照常出包，并把「未签名」
            # 这件事写进 SIGNING_STATUS.txt 随 Release 一起发布，让用户能看到状态。
            # 代价是 macOS 首次打开需绕过 Gatekeeper、Windows 会有 SmartScreen 提示。
            if [[ "${{ runner.os }}" != "Linux" ]]; then
              message="${{ runner.os }} signing credentials are incomplete: ${missing[*]}"
              require_signed="$(printf '%s' "$REQUIRE_SIGNED_RELEASES" | tr '[:upper:]' '[:lower:]')"
              if [[ "$require_signed" == "true" ]]; then
                echo "::error::${message}. REQUIRE_SIGNED_RELEASES=true forbids unsigned packages."
                exit 1
              fi
              echo "::warning::${message}. Producing unsigned packages."
            fi
          fi

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && env.AERORIC_SIGN_RELEASE == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/aeroric-release.p12"
          keychain_path="$RUNNER_TEMP/aeroric-release.keychain-db"
          CERTIFICATE_PATH="$certificate_path" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = "".join(os.environ["APPLE_CERTIFICATE"].split())
          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(encoded))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              sed -n 's/.*\"\\(Developer ID Application:.*\\)\"/\\1/p' |
              head -n 1
          )"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity was found in APPLE_CERTIFICATE"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.AERORIC_SIGN_RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "aeroric-release.pfx"
          $certificateBytes = [Convert]::FromBase64String(
            ($env:WINDOWS_CERTIFICATE -replace "\s", "")
          )
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $securePassword = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -Force `
            -AsPlainText
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePassword
          if (-not $certificate.HasPrivateKey) {
            throw "The imported Windows certificate does not contain a private key."
          }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare Windows MSI bundle version
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base_version="${version%%-*}"
          prerelease="${version#*-}"
          bundle_version="$version"

          if [[ "$prerelease" != "$version" ]]; then
            numeric_suffix="${prerelease##*.}"
            if [[ ! "$numeric_suffix" =~ ^[0-9]+$ ]]; then
              echo "::error::Windows MSI requires a numeric prerelease suffix, got '$prerelease'"
              exit 1
            fi
            numeric_value=$((10#$numeric_suffix))
            if (( numeric_value > 65535 )); then
              echo "::error::Windows MSI prerelease number must be <= 65535, got '$numeric_value'"
              exit 1
            fi
            bundle_version="${base_version}-${numeric_value}"
          fi

          if [[ "$AERORIC_SIGN_RELEASE" == "true" ]]; then
            timestamp_url="${WINDOWS_TIMESTAMP_URL:-http://timestamp.digicert.com}"
            jq -n \
              --arg version "$bundle_version" \
              --arg thumbprint "$WINDOWS_CERTIFICATE_THUMBPRINT" \
              --arg timestampUrl "$timestamp_url" \
              '{
                version: $version,
                bundle: {
                  windows: {
                    certificateThumbprint: $thumbprint,
                    digestAlgorithm: "sha256",
                    timestampUrl: $timestampUrl
                  }
                }
              }' > tauri.windows-release.json
          else
            jq -n --arg version "$bundle_version" '{version: $version}' \
              > tauri.windows-release.json
          fi
          env_file="$GITHUB_ENV"
          if command -v cygpath >/dev/null 2>&1; then
            env_file="$(cygpath --unix "$GITHUB_ENV")"
          fi
          echo "TAURI_RELEASE_VERSION=$version" >> "$env_file"
          echo "TAURI_WINDOWS_BUNDLE_VERSION=$bundle_version" >> "$env_file"
        env:
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}

      # 刻意**不**写 shell: bash。Git Bash 会把 msys2 的 perl(/usr/bin/perl)顶到
      # PATH 最前面,而它缺 Locale::Maketext::Simple —— openssl-src 的 ./Configure
      # 经 OpenSSL::config → IPC::Cmd → Params::Check 依赖这个模块,于是 vendored
      # OpenSSL 在 configure 阶段就退 2,Windows 两个架构一起挂。
      # 默认 shell(pwsh)下 perl 解析到 Strawberry Perl,模块齐全:同一镜像、同一
      # commit 下 checks.yml 的 clippy 正是这么把 openssl-sys 编过去的。
      # 这一步的 run 是纯命令,不需要 bash 语法。
      - name: Build ${{ matrix.name }} (Windows)
        if: runner.os == 'Windows'
        run: >
          pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }}
          --config tauri.windows-release.json -- --locked

      - name: Restore prerelease version in Windows artifact filenames
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAURI_RELEASE_VERSION" == "$TAURI_WINDOWS_BUNDLE_VERSION" ]]; then
            rm -f tauri.windows-release.json
            exit 0
          fi

          for bundle in nsis msi; do
            bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/${bundle}"
            shopt -s nullglob
            for artifact in "$bundle_dir"/*"$TAURI_WINDOWS_BUNDLE_VERSION"*; do
              filename="${artifact##*/}"
              renamed="${filename//$TAURI_WINDOWS_BUNDLE_VERSION/$TAURI_RELEASE_VERSION}"
              mv "$artifact" "$bundle_dir/$renamed"
            done
            shopt -u nullglob
          done
          rm -f tauri.windows-release.json

      # `tauri.conf.json` 的基线是 ad-hoc(见那里的 macOS 段):没有 Developer ID 时
      # **本地构建**也必须是规范 ad-hoc,否则只剩链接器签名,TCC 授权全部作废。
      # 代价是基线把 hardenedRuntime 关了,而它是公证的前置条件,所以签名路径要在这里
      # 显式开回来。signingIdentity 不用管:`APPLE_SIGNING_IDENTITY` 优先于 config。
      - name: Prepare macOS signed config
        if: runner.os == 'macOS' && env.AERORIC_SIGN_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{ bundle: { macOS: { hardenedRuntime: true } } }' > tauri.macos-signed.json
          cat tauri.macos-signed.json

      - name: Build ${{ matrix.name }} (macOS, signed and notarized)
        if: runner.os == 'macOS' && env.AERORIC_SIGN_RELEASE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }}
          --config tauri.macos-signed.json -- --locked

      - name: Clean up macOS signed config
        if: always() && runner.os == 'macOS' && env.AERORIC_SIGN_RELEASE == 'true'
        shell: bash
        run: rm -f tauri.macos-signed.json

      # ad-hoc 不再需要 overlay:`tauri.conf.json` 的基线就是 ad-hoc,CI 与本地构建
      # 因此产出同一种签名——本地构建曾经只有链接器签名,那会让 TCC 授权全部作废。
      #
      # ad-hoc 换不来什么:无法公证,Gatekeeper 首次打开仍需右键>打开;且 designated
      # requirement 绑 cdhash,每次重新构建都会变,所以跨版本升级后系统权限仍需重新
      # 授予(权限面板会检测到并给出「重新授权」)。要消掉这两点只能上 Developer ID。
      - name: Build ${{ matrix.name }} (macOS, ad-hoc signed)
        if: runner.os == 'macOS' && env.AERORIC_SIGN_RELEASE != 'true'
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }} -- --locked

      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS' && env.AERORIC_SIGN_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          app_path="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Aeroric.app"
          # 这一条是真正的闸门:bundle 级签名(Contents/_CodeSignature)缺失时它退 1。
          # 实测过——把 _CodeSignature 删掉后 verify 退 1,而 `codesign --display` 仍
          # 报 Signature=adhoc(因为内层 Mach-O 带着链接器加的那份),所以单看 display
          # 是分辨不出「整包签好了」和「只有内层带签名」的。
          codesign --verify --deep --strict --verbose=2 "$app_path"
          # 附带确认这条路径产出的确实是 ad-hoc:签名配置被串到这一支时(比如误用了
          # Developer ID)这里会红,免得状态说明与实际产物不一致。
          if ! codesign --display --verbose=4 "$app_path" 2>&1 | grep -q 'Signature=adhoc'; then
            echo "::error::Expected an ad-hoc signature on the app bundle"
            codesign --display --verbose=4 "$app_path" || true
            exit 1
          fi
          echo "ad-hoc signature verified"

      - name: Build ${{ matrix.name }} (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }} -- --locked

      - name: Package deterministic macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) dmg_arch="aarch64" ;;
            x86_64-apple-darwin) dmg_arch="x64" ;;
            *) echo "::error::Unsupported macOS target: ${{ matrix.target }}"; exit 1 ;;
          esac
          ./scripts/create-macos-dmg.sh \
            "$bundle_root/macos/Aeroric.app" \
            "$bundle_root/dmg/Aeroric_${version}_${dmg_arch}.dmg" \
            "Aeroric ${version}"

      - name: Notarize and staple deterministic macOS DMG
        if: runner.os == 'macOS' && env.AERORIC_SIGN_RELEASE == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg_path="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "::error::Deterministic DMG was not produced"
            exit 1
          fi
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"

      - name: Verify Windows installer signatures
        if: runner.os == 'Windows' && env.AERORIC_SIGN_RELEASE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleRoot = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $artifacts = @(
            Get-ChildItem "$bundleRoot/nsis" -Filter *.exe -File
            Get-ChildItem "$bundleRoot/msi" -Filter *.msi -File
          )
          if ($artifacts.Count -ne 2) {
            throw "Expected one signed NSIS installer and one signed MSI; found $($artifacts.Count)."
          }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on $($artifact.Name): $($signature.Status)"
            }
            Write-Host "Verified Authenticode signature: $($artifact.Name)"
          }
          "windows signatures verified" |
            Out-File "$bundleRoot/SIGNING_STATUS-${{ matrix.artifact_name }}.txt" -Encoding utf8

      - name: Record unsigned Windows package status
        if: runner.os == 'Windows' && env.AERORIC_SIGN_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          artifacts=("$bundle_root"/nsis/*.exe "$bundle_root"/msi/*.msi)
          shopt -u nullglob
          if [[ "${#artifacts[@]}" -ne 2 ]]; then
            echo "::error::Expected one NSIS installer and one MSI; found ${#artifacts[@]}."
            exit 1
          fi
          printf 'Windows installers are unsigned because repository signing secrets are not configured.\n' \
            > "$bundle_root/SIGNING_STATUS-${{ matrix.artifact_name }}.txt"

      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS' && env.AERORIC_SIGN_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$bundle_root/macos/Aeroric.app"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ ! -d "$app_path" || -z "$dmg_path" ]]; then
            echo "::error::Expected signed app bundle and DMG were not produced"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$dmg_path"
          printf 'macOS signature and notarization verified\n' \
            > "$bundle_root/SIGNING_STATUS-${{ matrix.artifact_name }}.txt"

      - name: Record unsigned macOS package status
        if: runner.os == 'macOS' && env.AERORIC_SIGN_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$bundle_root/macos/Aeroric.app"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ ! -d "$app_path" || -z "$dmg_path" ]]; then
            echo "::error::Expected app bundle and DMG were not produced"
            exit 1
          fi
          {
            printf 'macOS app bundle is ad-hoc signed (signingIdentity "-").\n'
            printf 'It is NOT Developer ID signed and NOT notarized, because repository signing secrets are not configured.\n'
            printf '\n'
            printf 'What this means for you:\n'
            printf '  - First launch: Gatekeeper will block a double-click. Right-click the app and choose Open, then confirm.\n'
            printf '  - System permissions (Screen Recording, Accessibility, ...) are remembered within this build, but macOS\n'
            printf '    ties them to the ad-hoc signature, which changes every release. Expect to re-grant them after updating.\n'
          } > "$bundle_root/SIGNING_STATUS-${{ matrix.artifact_name }}.txt"

      - name: Record Linux signing policy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          printf 'Linux package signing is not configured; package checksums are verified at release.\n' \
            > "$bundle_root/SIGNING_STATUS-${{ matrix.artifact_name }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/SIGNING_STATUS-*.txt

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Flatten artifact directories
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          # download-artifact with merge-multiple preserves per-artifact
          # subdirectories (e.g. macos-arm64/dmg/*.dmg). Move every file up
          # to the root so the verify step can find it by bare filename.
          find . -mindepth 2 -type f -exec mv -f {} . \;
          find . -mindepth 1 -type d -empty -delete
          echo "Flattened release artifacts:"
          find . -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Verify release assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          expected=(
            "Aeroric-${VERSION}-1.x86_64.rpm"
            "Aeroric_${VERSION}_aarch64.dmg"
            "Aeroric_${VERSION}_amd64.deb"
            "Aeroric_${VERSION}_arm64-setup.exe"
            "Aeroric_${VERSION}_arm64_en-US.msi"
            "Aeroric_${VERSION}_x64-setup.exe"
            "Aeroric_${VERSION}_x64.dmg"
            "Aeroric_${VERSION}_x64_en-US.msi"
          )
          signing_status_markers=(
            "SIGNING_STATUS-linux-x86_64.txt"
            "SIGNING_STATUS-macos-arm64.txt"
            "SIGNING_STATUS-macos-x86_64.txt"
            "SIGNING_STATUS-windows-arm64.txt"
            "SIGNING_STATUS-windows-x86_64.txt"
          )

          missing=0
          for marker in "${signing_status_markers[@]}"; do
            if [[ ! -f "release-artifacts/${marker}" ]]; then
              echo "::error::Missing platform signing-status marker: ${marker}"
              missing=1
            fi
          done
          for asset in "${expected[@]}"; do
            if [[ ! -f "release-artifacts/${asset}" ]]; then
              echo "::error::Missing release asset: ${asset}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "Available release artifacts:"
            find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          {
            printf 'Aeroric %s installer signing status\n\n' "$VERSION"
            for marker in "${signing_status_markers[@]}"; do
              printf '%s: ' "${marker#SIGNING_STATUS-}"
              cat "release-artifacts/${marker}"
            done
          } > release-artifacts/SIGNING_STATUS.txt
          rm -- "release-artifacts"/SIGNING_STATUS-*.txt

          (
            cd release-artifacts
            shasum -a 256 "${expected[@]}" > SHA256SUMS.txt
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Only upload installer artifacts and the checksum file.
          # The download-artifact step also downloads unrelated
          # artifacts (e.g. web-coverage HTML from the quality-gate
          # workflow); this explicit list ensures only the expected
          # files are published to the GitHub Release.
          files: |
            release-artifacts/*.rpm
            release-artifacts/*.dmg
            release-artifacts/*.deb
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/SHA256SUMS.txt
            release-artifacts/SIGNING_STATUS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
