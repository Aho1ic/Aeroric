name: Checks

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

# 同一 ref 的新提交会取消还在跑的旧检查;push(main)不取消,避免误杀发布门禁。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-and-notes:
    # 笔记与文档门禁：只需 Node 内置模块，跑在便宜的 Linux 上。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify agent notes
        env:
          # 归档封印的 append-only 要与变更前的提交比对；新分支 push 的 before 为全 0 时脚本跳过该项。
          AGENT_NOTE_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run verify-notes

      - name: Verify docs
        run: |
          npm run verify-docs
          node --test scripts/native/verify-docs.test.mjs

  checks:
    # Apple-only product (ADR-039): core, host and the Swift packages are
    # verified on macOS only.
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout dbx dependency
        shell: bash
        run: |
          set -euo pipefail
          # core 通过 `path = "../../dbx/..."` 依赖 dbx，这条依赖不受 Cargo.lock
          # 约束；提交号钉在 scripts/dbx-ref.txt，与 scripts/prepare-dbx.sh 共用。
          DBX_REF="$(tr -d '[:space:]' <scripts/dbx-ref.txt)"
          git init ../dbx
          git -C ../dbx fetch --depth 1 https://github.com/t8y2/dbx.git "$DBX_REF"
          git -C ../dbx checkout --detach "$DBX_REF"

      - name: Apply Aeroric DBX security patch
        shell: bash
        run: ./scripts/prepare-dbx.sh

      - name: Setup Rust
        # stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        # v2
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            ./core -> target
            ./remote-protocol -> target
            ./remote-push -> target
            ./remote-relay -> target

      # core 是虚拟 workspace，`--manifest-path core/Cargo.toml --check` 会报
      # "Failed to find targets"；与原生门禁一致，进入 core/ 再检查。
      - name: Check core formatting
        shell: bash
        run: cd core && cargo fmt --check

      - name: Check remote crates formatting
        shell: bash
        run: |
          for crate in remote-protocol remote-push remote-relay; do
            cargo fmt --manifest-path "$crate/Cargo.toml" -- --check
          done

      - name: Run core Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run remote crates Clippy
        shell: bash
        run: |
          for crate in remote-protocol remote-push remote-relay; do
            cargo clippy --manifest-path "$crate/Cargo.toml" --locked --all-targets -- -D warnings
          done

      - name: Run core tests
        run: cargo test --manifest-path core/Cargo.toml --locked --all-targets

      - name: Run remote crates tests
        shell: bash
        run: |
          for crate in remote-protocol remote-push remote-relay; do
            cargo test --manifest-path "$crate/Cargo.toml" --locked --all-targets
          done

      - name: Build and test AeroricKit (macOS)
        run: swift test --package-path macos/AeroricKit

      - name: Build and test AeroricCompanionKit (iOS)
        run: swift build --package-path ios/AeroricCompanionKit
