[workspace]
# Independent Rust workspace: remote-protocol/, remote-push/ and remote-relay/
# keep their own manifests and lock files on purpose.
resolver = "2"
members = ["crates/aeroric-protocol", "crates/aeroric-core", "crates/aeroric-host", "crates/aeroric-cli"]
# Vendored path crates live under core/vendor/; keep them out of the workspace so
# their own dev-dependencies never enter Cargo.lock.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
authors = ["Aeroric"]
license-file = "../LICENSE"
publish = false
repository = "https://github.com/Aeroric/Aeroric"

[workspace.dependencies]
aeroric-protocol = { path = "crates/aeroric-protocol" }
aeroric-core = { path = "crates/aeroric-core" }
aeroric-host = { path = "crates/aeroric-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time", "process", "io-util", "net", "fs", "signal", "io-std"] } # signal/io-std：aeroric-cli serve 的优雅关停与 attach 的 stdin/stdout 中继（P3-07）
base64 = "0.22"
parking_lot = "0.12"
portable-pty = { path = "vendor/portable-pty" }

# This workspace root is the patch owner for everything it resolves; patches
# declared in a member crate are silently ignored by Cargo, so the mapping lives
# here. Vendored crates live in core/vendor/; dbx is a sibling repository.
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
ssfmt = { path = "vendor/ssfmt" }
notify-types = { path = "vendor/notify-types" }
mysql_async = { git = "https://github.com/zipg/mysql_async.git", rev = "4a9e60a62f5a48e35ef9ccc9fc8277d5012b19dd" }
tokio-postgres = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
postgres-types = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
postgres-protocol = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
tiberius = { path = "../../dbx/vendor/tiberius" }
pageant = { path = "../../dbx/vendor/pageant" }

[profile.dev]
debug = 0

[workspace.lints.clippy]
too_many_arguments = "allow"
large_enum_variant = "allow"
type_complexity = "allow"
