[package]
name = "aeroric-cli"
description = "Headless Aeroric CLI: serve/run/task/project/session/approval/rpc/events/attach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22" # 与 host 同版：attach 的按键/输出字节通道
clap = { version = "4", features = ["derive"] } # P3-07 Action 1 的命令树；全仓第一个 clap（宿主/core 零命中是具名前置的实测，不是回避理由——手写 12 组子命令的解析面不如一个成熟 parser 可审）
aeroric-host = { workspace = true }
aeroric-core = { workspace = true }
aeroric-protocol = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1", features = ["v4"] } # 与 core/宿主同版：idempotency key 铸造（Action 6 的 mutation 契约）

[target.'cfg(unix)'.dependencies]
libc = "0.2" # termios raw RAII 与 TIOCGWINSZ（与 core/host 同口径）
