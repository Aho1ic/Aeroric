[package]
name = "aeroric-core"
description = "Business services, persistence, PTY runtime and external-agent adapters (no Tauri, no GUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aeroric-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zstd = "0.13" # 与宿主 src-tauri 同 crate 同版本——手写约束 8：不得引入第二个 zstd 实现
sha2 = "0.10.9"
thiserror = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
portable-pty = { workspace = true }
chrono = "0.4" # 与宿主同 crate 同版本（sessions/resume 的 RFC3339 起算与 export 的时间戳格式化，第五片）
url = "2" # 与宿主同 crate 同版本（dsh_host/startup 的启动 URL 闸门，P3-05 第五片）
trash = "=5.2.6" # 与宿主同 crate 同版本（files/delete_path 的回收站删除——不默认永久删除，P6-01）
notify = "6" # 与宿主同 crate 同版本（files/watcher 的真实 watcher；宿主 event_watcher 同款）
base64 = "0.22" # 与宿主同 crate 同版本（connections/ssh 的 host key 指纹）
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] } # 与宿主 src-tauri/Cargo.toml:52 逐字一致（notebook/import 的 zip_src——P7-05）
quick-xml = "0.41" # 与宿主同 crate 同版本（notebook/import/evernote 的 ENEX 良构 XML——P7-05）
md-5 = "0.11" # 与宿主同 crate 同版本（ENEX <en-media hash> 的 MD5 附件对账；仅测试引用——P7-05）
opendal = { version = "0.58.1", features = [
  "services-s3",
  "services-oss",
  "services-cos",
  "services-upyun",
  "services-webdav",
  "services-dropbox",
  "services-gdrive",
  "services-onedrive",
  "services-aliyun-drive",
] } # 与宿主 src-tauri/Cargo.toml:103 逐字一致（storage_backends 的 9 家对象存储/网盘——P7-06）
smb2 = "0.18.1" # 与宿主同版本（纯 Rust SMB 客户端，无需 sudo 挂载——P7-06）
cap-std = "4" # 与宿主同 crate 同版本（mount 后端的 ambient-authority 目录句柄——P7-06）
rusqlite = { version = "0.32", features = ["bundled", "backup"] } # 与宿主 src-tauri/Cargo.toml:85 逐字一致（sync/store 的 sync.db＋rag/db 的 sqlite-vec——P7-06）
sqlite-vec = "0.1" # 与宿主同 crate 同版本（rag/db 的 vec0 虚表，链接进二进制——P7-06）
dbx-core = { path = "../../../../dbx/crates/dbx-core", default-features = false } # 与宿主同 path（database/sql_risk 纯函数——P7-04）
serde_yaml_ng = "0.10" # 与宿主同 crate 同版本（dsh_host/client 的插件 patch/dump 线数据解析，P3-05 第十一片；纯解析零 I/O）
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "socks", "stream", "query", "form", "multipart"] } # grill [dsh] D1（补记二百六十四，2026-09-30 用户决策）：core 自此持网络出口，`DshApiClient` 上收用；feature 集与宿主 `src-tauri/Cargo.toml:46` 逐字一致，不造第二套传输
uuid = { version = "1", features = ["v4"] } # 与宿主 src-tauri/Cargo.toml:64 逐字一致——dsh transport 的 rpcId 铸造（`DshApiClient::call`，方法群片补记二百六十五 §3）
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] } # 与宿主 :68 逐字一致——remote_mux 的 WS 传输（方法群片随 DshApiClient 上收，D1 同类：网络出口）
futures-util = "0.3" # 与宿主 :69 逐字一致——mux worker 的 SinkExt/StreamExt

# runtime::subprocess(P3-01 切片二自宿主迁入)只在 unix 分支调 libc(setpgid/kill);
# Windows 分支只用 std 的 creation_flags,不引入 windows-sys。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
zstd = "0.13"
